services:
  - type: web
    name: spendpulse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URL
        sync: false
      - key: DATABASE_NAME
        value: spendpulse
      - key: ALLOWED_ORIGINS
        sync: false
